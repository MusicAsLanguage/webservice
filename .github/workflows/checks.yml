name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .

  tests:
    name: Tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        database: [mock, mongodb]
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_MONGODB_URI: ${{ matrix.database == 'mongodb' && 'mongodb://127.0.0.1:27017' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest --cov --cov-report=term-missing --cov-report=xml -q
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.database }}
          path: coverage.xml

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build --tag mal-service:ci .
      - name: Smoke-test installed runtime dependencies
        run: |
          docker run --rm --entrypoint python mal-service:ci -c "import sys, sysconfig; assert sys.version_info[:2] == (3, 14), sys.version; assert not sysconfig.get_config_var('Py_GIL_DISABLED'); print(sys.version)"
          docker run --rm --entrypoint python mal-service:ci -m pip check
          docker run --rm --entrypoint python mal-service:ci -c "import whisper; import app"
          docker run --rm --entrypoint python mal-service:ci -c "import numpy as np; import whisper; audio = np.zeros(16000, dtype=np.float32); mel = whisper.log_mel_spectrogram(audio); assert tuple(mel.shape) == (80, 100); assert mel.isfinite().all()"
          docker run --rm --entrypoint ffmpeg mal-service:ci -version
          docker run --rm --entrypoint gunicorn mal-service:ci --version
      - name: Smoke-test Gunicorn HTTP startup
        run: |
          trap 'docker logs mal-service-smoke; docker rm --force mal-service-smoke' EXIT
          docker run --detach --name mal-service-smoke \
            --publish 127.0.0.1:8000:8000 \
            --env APP_ENV=test \
            --env MONGODB_SETTINGS=mongodb://127.0.0.1:27017/mal_runtime_smoke \
            mal-service:ci
          response=$(curl --fail --silent --show-error --retry 10 --retry-delay 1 \
            --retry-connrefused --retry-all-errors --retry-max-time 30 --max-time 5 \
            http://127.0.0.1:8000/resetPwd/runtime-smoke)
          printf '%s' "$response" | grep -F 'value="runtime-smoke"'

  gate:
    name: Quality gate
    if: ${{ always() }}
    needs: [lint, tests, container]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every check to pass
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          test "$LINT_RESULT" = success &&
          test "$TEST_RESULT" = success &&
          test "$CONTAINER_RESULT" = success
