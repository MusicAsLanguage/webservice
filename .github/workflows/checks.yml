name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .

  tests:
    name: Tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        database: [mock, mongodb]
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_MONGODB_URI: ${{ matrix.database == 'mongodb' && 'mongodb://127.0.0.1:27017' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest --cov --cov-report=term-missing --cov-report=xml -q
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.database }}
          path: coverage.xml

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag mal-service:ci .
      - name: Smoke-test installed runtime dependencies
        run: |
          docker run --rm --entrypoint python mal-service:ci -c "import whisper; import app"
          docker run --rm --entrypoint ffmpeg mal-service:ci -version
          docker run --rm --entrypoint gunicorn mal-service:ci --version

  gate:
    name: Quality gate
    if: ${{ always() }}
    needs: [lint, tests, container]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every check to pass
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          test "$LINT_RESULT" = success &&
          test "$TEST_RESULT" = success &&
          test "$CONTAINER_RESULT" = success
