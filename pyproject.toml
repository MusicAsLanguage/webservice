[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app", "config", "cache", "database", "resources", "services"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
